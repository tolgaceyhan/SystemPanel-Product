# SystemPanel CI: tüm çözümü (web, agent, dashboard, testler) derler ve testleri çalıştırır.
# Dashboard (WPF) Linux'ta EnableWindowsTargeting ile derlenir; çalıştırılmaz.

name: .NET

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore SystemPanel.sln
    - name: Build
      run: dotnet build SystemPanel.sln --no-restore
    - name: Test
      run: dotnet test SystemPanel.sln --no-build --verbosity normal
