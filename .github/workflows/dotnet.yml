# SystemPanel CI: tüm çözümü (web, agent, dashboard, testler) derler ve testleri çalıştırır.
# Dashboard (WPF) Linux'ta EnableWindowsTargeting ile derlenir; çalıştırılmaz.

name: .NET

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore SystemPanel.sln
    - name: Build
      run: dotnet build SystemPanel.sln --no-restore
    - name: Test
      run: dotnet test SystemPanel.sln --no-build --verbosity normal

  # Windows: PowerShell betiklerinin sözdizimi/analizi ve sürüm paketinin gerçekten üretilebildiğinin doğrulanması.
  windows-package:
    runs-on: windows-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: PowerShell syntax check
      shell: pwsh
      run: |
        $failed = $false
        Get-ChildItem -Recurse -Filter *.ps1 -Path scripts, build, src/SystemPanel/scripts | ForEach-Object {
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
          foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
        }
        if ($failed) { exit 1 }
    - name: PSScriptAnalyzer (errors)
      shell: pwsh
      run: |
        Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
        $issues = @()
        foreach ($dir in 'scripts', 'build') {
          $issues += @(Invoke-ScriptAnalyzer -Path $dir -Recurse -Severity Error)
        }
        foreach ($i in $issues) { Write-Host "::error file=$($i.ScriptPath),line=$($i.Line)::$($i.RuleName): $($i.Message)" }
        if ($issues.Count -gt 0) { exit 1 }
    - name: Build release package
      shell: pwsh
      run: |
        try {
          ./build/Build-Release.ps1 -Version 0.0.0-ci.${{ github.run_number }} -SkipTests *>&1 | Tee-Object -FilePath build-release.log
        }
        catch {
          if (Test-Path build-release.log) {
            Get-Content build-release.log | Select-String -Pattern 'error|hata|başarısız|exception' | Select-Object -Last 20 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          }
          Write-Host "::error::$($_.Exception.Message)"
          exit 1
        }
    - uses: actions/upload-artifact@v4
      with:
        name: systempanel-package
        path: |
          artifacts/*.zip
          artifacts/SHA256SUMS.txt
        retention-days: 7
